[project]
name = "train-pusher-client"
version = "0.1.0"
description = "ESPHome firmware configurations for a Lego Duplo train controller"
requires-python = ">=3.11,<3.15"
dependencies = [
    "esphome==2026.3.0",
]

[tool.uv]
package = false
# Preserve the existing environment's cbor2 version. Resolving 6.1.5 required a
# Rust source build on macOS x86_64 because that release has no matching wheel.
constraint-dependencies = ["cbor2==5.8.0"]
